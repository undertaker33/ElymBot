:root {
  --paper:#f7f0e6;
  --paper-top:#fcf7ef;
  --surface:#fffbf5;
  --ink:#35251d;
  --muted:#735d50;
  --accent:#7b4733;
  --accent-ink:#fff8f2;
  --soft:#f1e0d1;
  --line:#e5d7c8;
  --success:#356445;
  --success-bg:#e9efe2;
  --floating:rgba(255,250,243,.78);
  --floating-line:rgba(255,253,248,.85);
  --shadow:0 8px 24px #3e211b26,0 2px 7px #3e211b15;
  --title:GallerySong,"Noto Serif CJK SC","Songti SC",STSong,serif;
  --body:system-ui,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
  --nav-height:66px;
  --base-inset:max(13px,env(safe-area-inset-bottom));
  --nav-bottom:calc(var(--base-inset) + 7px);
  --nav-clearance:calc(var(--nav-height) + var(--nav-bottom) + 14px);
  font-family:var(--body);
  color:var(--ink);
  color-scheme:light;
}
:root[data-theme=dark] {
  --paper:#201915;--paper-top:#2b211b;--surface:#2f241e;--ink:#f7e9da;--muted:#ccb8a9;
  --accent:#efba9d;--accent-ink:#41291e;--soft:#4b342b;--line:#574139;
  --success:#b0d8af;--success-bg:#263b2c;--floating:rgba(48,37,30,.79);--floating-line:rgba(245,217,194,.25);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#eae0d4}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
button:focus-visible, a:focus-visible, summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
a{color:var(--accent)}
.icon{width:22px;height:22px;display:block;flex:none}
.layout{min-height:100dvh}
.app{
  position:relative;display:grid;grid-template-rows:auto auto minmax(0,1fr);isolation:isolate;
  width:100%;height:100dvh;overflow:hidden;background:linear-gradient(155deg,var(--paper-top),var(--paper) 53%);
}
.status{
  height:calc(34px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 26px 0;
  display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:750;
  font-variant-numeric:tabular-nums;letter-spacing:.015em;
}
.status-icons{display:flex;align-items:center;gap:5px}
.signal{width:11px;height:9px;background:currentColor;clip-path:polygon(0 100%,100% 0,100% 100%)}
.wifi{width:12px;height:9px;background:currentColor;clip-path:polygon(0 16%,18% 0,82% 0,100% 16%,50% 100%)}
.battery{position:relative;width:14px;height:8px;border:1px solid currentColor;border-radius:2px;background:currentColor}
.battery::after{content:"";position:absolute;left:100%;top:1px;width:2px;height:4px;margin-left:1px;background:currentColor;border-radius:1px}
.header{display:flex;align-items:center;gap:4px;min-width:0;padding:6px 18px 9px;min-height:65px}
.header h1{margin:0;min-width:0;flex:1;font-size:26px;line-height:1.2;letter-spacing:.015em}
.header h1.gallery-title{font-family:var(--title);font-size:40px;letter-spacing:.035em;line-height:1.1}
.header .sub-title{font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header .actions{display:flex;gap:3px;align-items:center}
.icon-button{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:50%}
.icon-button.round{border:1px solid var(--line);background:var(--surface);color:var(--accent)}
.icon-button.primary,.primary{background:var(--accent);color:var(--accent-ink)}
.icon-button:active,.primary:active,.secondary:active,.list-row:active{filter:brightness(.94)}
.content{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;padding:0 18px 24px}
.content::-webkit-scrollbar{display:none}
.content.root{
  padding-bottom:var(--nav-clearance);
  scroll-padding-bottom:var(--nav-clearance);
}
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:2px 0 11px}
.filter{padding:0;min-width:0;min-height:48px;white-space:nowrap;font-size:13px;font-weight:640}
.filter span{display:grid;place-items:center;min-height:32px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.filter[aria-pressed=true] span{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.search{display:flex;align-items:center;gap:6px;margin:0 0 6px;padding-left:13px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.search input{min-width:0;flex:1;border:0;background:none;padding:10px 0;outline:none}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.card{position:relative;min-width:0;aspect-ratio:1.06;overflow:hidden;isolation:isolate;border-radius:18px;background:#5d4439;box-shadow:0 2px 5px #321c161a}
.card.featured{grid-column:1 / -1;aspect-ratio:1.79}
.card-cover{position:absolute;inset:0;overflow:hidden;container-type:size}
.cover-crop{
  position:absolute;top:50%;left:50%;width:max(100cqw,100cqh);aspect-ratio:1;
  transform:translate(-50%,-50%);overflow:hidden;
}
.featured .cover-crop{top:61%}
.cover-crop img{position:absolute;display:block;width:300%;max-width:none;left:calc(var(--column) * -100%);top:calc(var(--row) * -100%)}
.custom-cover{width:100%;height:100%;object-fit:cover}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 29%,#150e1380 65%,#150e13e8);pointer-events:none}
.card-open{
  position:absolute;inset:0;z-index:1;width:100%;padding:12px;
  display:flex;flex-direction:column;justify-content:end;align-items:start;text-align:left;color:#fffbf3;
}
.card-open:focus-visible{outline:2px solid white;outline-offset:-4px}
.featured .card-open{padding:16px}
.card-name{max-width:100%;font-family:var(--title);font-size:23px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.featured .card-name{font-size:32px}
.card-desc{margin-top:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#ffefe5}
.featured .card-desc{font-size:12px}
.active-badge{position:absolute;top:11px;left:11px;display:flex;align-items:center;gap:3px;padding:4px 8px;background:#fae8c7;color:#512f23;border-radius:99px;font-size:10px;font-weight:720}
.active-badge .icon{width:13px;height:13px}
.navigation{
  position:absolute;z-index:3;left:12px;right:12px;bottom:var(--nav-bottom);
  height:var(--nav-height);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;
  padding:5px 6px;border:1px solid var(--floating-line);border-radius:28px;
  background:var(--floating);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(17px) saturate(1.25);
  backdrop-filter:blur(17px) saturate(1.25);
}
.nav-item{
  display:flex;min-width:0;min-height:48px;flex-direction:column;gap:2px;align-items:center;justify-content:center;
  border-radius:19px;color:var(--ink);font-size:11px;font-weight:650;white-space:nowrap;padding:0;
}
.nav-icon{display:grid;place-items:center;width:45px;height:27px;border-radius:99px}
.nav-item[aria-current=page]{font-weight:750}
.nav-item[aria-current=page] .nav-icon{background:var(--soft);color:var(--accent)}
.nav-icon .icon{width:20px;height:20px}
.gesture{position:absolute;z-index:4;bottom:5px;left:50%;transform:translateX(-50%);width:88px;height:4px;background:var(--ink);opacity:.52;border-radius:9px;pointer-events:none}
.toast{
  position:absolute;z-index:5;bottom:calc(var(--base-inset) + 82px);left:50%;transform:translateX(-50%);
  max-width:calc(100% - 40px);width:max-content;pointer-events:none;opacity:0;padding:9px 14px;border-radius:12px;
  background:var(--ink);color:var(--paper-top);font-size:13px;transition:opacity .15s;
}
.toast.show{opacity:1}
.section{margin:7px 0 19px}
.section h2{margin:0 0 7px 3px;color:var(--muted);font-size:12px;font-weight:720}
.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.list-row{
  display:flex;align-items:center;gap:11px;min-height:63px;width:100%;text-align:left;padding:10px 12px;
}
.list-row + .list-row{border-top:1px solid var(--line)}
.row-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--soft);color:var(--accent);flex:none}
.row-icon .icon{width:18px;height:18px}
.row-text{flex:1;min-width:0;overflow-wrap:anywhere}
.row-title{display:block;font-weight:700;font-size:14px}
.row-sub{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.4}
.row-end{display:flex;align-items:center;gap:4px;flex:none}
.row-end .icon{width:15px;height:15px;color:var(--muted)}
.badge{font-size:10px;padding:4px 7px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:700;white-space:nowrap}
.badge.on{background:var(--success-bg);color:var(--success)}
.empty{display:grid;justify-items:center;text-align:center;color:var(--muted);gap:10px;padding:28px 9px}
.empty .icon{color:var(--accent);width:28px;height:28px}
.empty p{margin:0;font-size:13px;line-height:1.6}
.primary,.secondary,.plain{border-radius:13px;min-height:48px;padding:8px 14px;font-size:14px;font-weight:700}
.secondary{background:var(--soft);color:var(--accent)}
.plain{color:var(--accent)}
.actions-line{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 0}
.summary-card{padding:15px;border:1px solid var(--line);background:var(--surface);border-radius:17px;margin:5px 0 17px}
.summary-card h2{margin:0 0 6px;font-size:17px}
.summary-card p,.sheet-copy{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
.chat{display:flex;flex-direction:column;padding:0 0 var(--base-inset);overflow:hidden}
.messages{flex:1;overflow:auto;scrollbar-width:none;padding:8px 16px 12px;overscroll-behavior:contain}
.message{display:flex;flex-direction:column;align-items:start;margin-bottom:12px}
.message.user{align-items:end}
.message small{color:var(--muted);font-size:11px;margin:0 4px 3px}
.bubble{max-width:min(84%,345px);background:var(--surface);border:1px solid var(--line);padding:9px 12px;border-radius:6px 16px 16px 16px;line-height:1.55;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.user .bubble{background:var(--soft);border-color:transparent;border-radius:16px 6px 16px 16px}
.bubble img{display:block;width:min(100%,210px);border-radius:8px;max-height:175px;object-fit:contain}
.composer{border-top:1px solid var(--line);padding:8px 12px 4px;display:flex;align-items:end;gap:5px}
.composer textarea{min-width:0;flex:1;resize:none;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:12px;min-height:48px;font-size:16px}
.attachment{display:flex;align-items:center;gap:8px;padding:4px 13px 5px;color:var(--muted);font-size:12px}
.attachment img{width:36px;height:36px;object-fit:cover;border-radius:6px}
.attachment button{margin-left:auto}
.readonly{padding:8px 18px 5px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
dialog{
  position:fixed;inset:auto auto var(--sheet-bottom,0px) var(--sheet-left,0px);margin:0;
  border:1px solid var(--line);border-radius:24px 24px 0 0;width:var(--sheet-width,100%);max-width:none;
  max-height:var(--sheet-height,85dvh);overflow:auto;overscroll-behavior:contain;
  padding:12px 18px calc(18px + env(safe-area-inset-bottom));background:var(--surface);color:var(--ink);box-shadow:var(--shadow)
}
dialog[open]{display:flex;flex-direction:column;overflow:hidden}
.sheet-head,.handle{flex:none}
.sheet-body{overflow:auto;min-height:0;overscroll-behavior:contain}
.sheet-body:has(>.form){display:flex;flex-direction:column;overflow:hidden}
dialog::backdrop{background:#261a186b}
.handle{width:34px;height:4px;border-radius:6px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin:3px 0 5px}
.sheet-head h2{margin:0;font-size:20px}
.form{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.form-fields{min-height:0;overflow:auto;overscroll-behavior:contain;display:grid;gap:10px;padding:2px 3px 5px}
.form .actions-line{margin:7px 0 0;padding-top:8px;border-top:1px solid var(--line);flex:none}
.field{display:grid;gap:5px;font-size:13px;font-weight:650}
.field input,.field textarea,.field select{
  min-width:0;max-width:100%;width:100%;min-height:46px;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;background:var(--paper-top);font-size:16px;font-weight:400;
}
.field textarea{resize:vertical;min-height:75px}
.file-trigger{position:relative;display:flex;align-items:center;min-height:46px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper-top);font-weight:400;overflow-wrap:anywhere}
.file-trigger input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.file-trigger:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
.field input[type=checkbox]{min-height:20px;min-width:20px;width:20px;margin:0;accent-color:var(--accent)}
.field.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0}
.sheet-copy{margin-bottom:8px}
.notes{display:none}
@media(max-width:350px){
  .header{padding-left:13px;padding-right:13px}
  .content{padding-left:13px;padding-right:13px}
  .content.chat{padding-left:0;padding-right:0}
  .gallery{gap:9px}
  .navigation{left:9px;right:9px}
}
@media(min-width:601px){
  .layout{display:grid;place-content:center;min-height:100dvh;padding:20px}
  .content{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .content::-webkit-scrollbar{display:block;width:6px}
  .app{width:420px;height:min(850px,calc(100dvh - 40px));border:1px solid #f7ead8;border-radius:33px;box-shadow:0 24px 75px #4d302832}
  dialog{border-radius:22px}
}
@media(min-width:880px){
  .layout{display:grid;grid-template-columns:420px minmax(250px,325px);align-items:center;gap:48px;padding-inline:26px}
  .notes{display:block;padding:18px 0;max-height:calc(100dvh - 52px);overflow:auto;line-height:1.65;color:#543f34}
  .notes .project{display:flex;align-items:center;gap:8px;margin:0 0 7px;font-size:14px;font-weight:750}
  .notes .project span{font-size:11px;font-weight:600}
  .notes h2{margin:0 0 12px;font-size:25px}
  .notes h3{font-size:15px;margin:0}
  .notes p,.notes li{font-size:13px}
  .notes details{padding:8px 0;border-top:1px solid #c9b5a5}
  .notes summary{font-size:13px;cursor:pointer;font-weight:650}
  .notes a{color:#6d3e29}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}

.field-help{margin:-4px 0 1px;color:var(--muted);font-size:12px;line-height:1.45}
#model-probe{
  inset:50dvh auto auto calc(var(--sheet-left) + var(--sheet-width)/2);
  transform:translate(-50%,-50%);width:min(380px,calc(var(--sheet-width) - 30px));
  max-height:min(510px,var(--sheet-height));border-radius:24px;padding:13px 16px 16px;
}
#model-probe::backdrop{background:#261a1852}
#model-probe .handle{display:none}
.probe-state{margin:2px 0 4px;font-size:15px;font-weight:740}
.probe-success{color:var(--success)}
.probe-url{margin:0 0 12px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.probe-search{
  width:100%;min-height:46px;margin:0 0 7px;padding:9px 11px;border:1px solid var(--line);
  border-radius:11px;background:var(--paper-top);font-size:16px;
}
.probe-models{display:grid;gap:5px}
.probe-option{
  min-height:45px;padding:8px 10px;text-align:left;border:1px solid var(--line);
  border-radius:10px;background:var(--paper-top);overflow-wrap:anywhere;font-size:13px;
}
.probe-option[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.probe-footer{flex:none;margin-top:10px}
.chat-error{margin:10px 0;padding:9px 11px;border-radius:10px;background:var(--soft);color:var(--accent);font-size:13px;overflow-wrap:anywhere}
.capability-results{display:grid;gap:8px}
.capability-row{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper-top)}
.capability-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.capability-row .sheet-copy{margin:5px 0 0}
.probe-notice{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.5}

.chat-header{padding:3px 16px 9px 5px;gap:5px;border-bottom:1px solid var(--line)}
.chat-header>.icon-button{margin-right:1px}
.avatar-button{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;flex:0 0 auto}
.chat-avatar{position:relative;display:block;width:42px;height:42px;overflow:hidden;border-radius:16px;container-type:size;background:var(--soft)}
.chat-heading{min-width:0;flex:1;padding-left:4px}
.chat-heading h1{font-size:19px}
.chat .messages{padding:19px 17px 10px}
.chat .message{margin-bottom:15px}
.chat .message small{margin-bottom:4px}
.chat .bubble{font-size:15px;line-height:1.64;padding:10px 13px;max-width:min(86%,345px)}
.chat .bubble img{margin-bottom:4px}
.turn-status{margin:5px 4px 0!important}
.chat-controls{flex:none;background:var(--paper-top);border-top:1px solid var(--line);padding:8px 10px 4px}
.chat-controls .composer{border:0;padding:0;align-items:center;gap:7px}
.chat-controls textarea{border-radius:17px}
.chat-controls .attachment{padding:0 3px 5px}
.chat-controls .attachment img{width:40px;height:40px;border-radius:8px}
.chat-controls .composer .primary{border-radius:16px}
.chat-error p{margin:5px 0 8px}
.chat-error button{min-height:40px}
.stream-bubble{min-height:42px}
.wait-dots{display:inline-flex;align-items:center;gap:4px}
.wait-dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite alternate}
.wait-dots i:nth-child(2){animation-delay:.15s}
.wait-dots i:nth-child(3){animation-delay:.3s}
@keyframes pulse{from{opacity:.32}to{opacity:1}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(prefers-reduced-motion:reduce){.wait-dots i{animation:none}}
.chat-controls textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.avatar-display{display:grid;place-items:center;width:48px;height:48px;flex:none}
.session-owner{color:var(--muted);font-size:12px}
.sessions-page{padding-top:10px;padding-bottom:calc(var(--base-inset) + 14px)}
.session-row{display:flex;align-items:center;gap:2px}
.session-row + .session-row{border-top:1px solid var(--line)}
.session-row .list-row{min-width:0;flex:1;padding-right:2px}
.session-row>.icon-button{margin-right:3px;color:var(--muted)}
.session-row .row-title,.session-row .row-sub{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.command-notice{margin:10px 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6}
.chat-busy{margin:0 3px 6px;color:var(--muted);font-size:12px}
.danger{min-height:48px;padding:8px 14px;border-radius:13px;background:#a52b32;color:white;font-size:14px;font-weight:700}
.chat-header{position:relative;z-index:2;padding-right:10px}
.chat-overflow{position:relative;flex:0 0 48px}
.chat-overflow summary{list-style:none;cursor:pointer}
.chat-overflow summary::-webkit-details-marker{display:none}
.chat-overflow[open] summary{background:var(--soft);color:var(--accent)}
.chat-menu-panel{
  position:absolute;right:0;top:calc(100% + 5px);width:min(218px,calc(100vw - 24px));
  padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)
}
.chat-menu-item{
  display:flex;align-items:center;gap:12px;width:100%;min-height:48px;
  padding:8px 12px;border-radius:11px;text-align:left;font-size:14px
}
.chat-menu-item:hover,.chat-menu-item:focus-visible{background:var(--soft)}
.chat-menu-item .icon{width:18px;height:18px}
.chat-menu-item.destructive{color:#a52b32}
:root[data-theme=dark] .chat-menu-item.destructive{color:#ff9a9a}

.avatar-button:focus-visible{outline-offset:2px}

</style>

<div class="layout">
  <div class="app" id="app" aria-label="ElymBot 原型">
    <div class="status" aria-hidden="true">
      <span>10:24</span>
      <span class="status-icons"><i class="signal"></i><i class="wifi"></i><i class="battery"></i></span>
    </div>
    <header id="header" class="header"></header>
    <main id="content" class="content"></main>
    <nav id="navigation" class="navigation" aria-label="主导航"></nav>
    <div class="gesture" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status"></div>
  </div>
  <aside class="notes" aria-labelledby="notes-title">
    <p class="project">ElymBot <span>v0.6.3</span></p>
    <h2 id="notes-title">任务一 · 高保真</h2>
    <div id="page-note"></div>
    <details>
      <summary>如何验收</summary>
      <p>点击封面进入主会话。在主会话右上角菜单打开「会话」，查看或新建当前人格的专属会话。未选择模型时为本地演示。配置模型后可向所选服务发出真实请求，API Key 仅在当前页面有效。平台、插件和设置预留导航位置。</p>

function command(route,value){
  const [name,...args] = value.split(/\s+/);
  const main = route === "chat";
  const allowed = main ? ["/persona N","/help","/checkpoint","/reset","/history"] : ["/help","/checkpoint","/reset","/history"];
  if (name === "/help") {
    const people = main ? "\n\n人格编号\n" + data.personas.map((persona,index) => (index + 1) + " · " + persona.name).join("\n") : "";
    localNotice(route,allowed.join("\n") + "\n\n/history · HistoryRead" + people);
  } else if (name === "/persona") {
    if (!main) localNotice(route,"/persona 仅在主会话可用。");
    else {
      const next = /^\d+$/.test(args[0] || "") ? data.personas[Number(args[0]) - 1] : null;
      if (!next || args.length !== 1) localNotice(route,"请输入 /persona N。使用 /help 查看人格编号。");
      else {
        data.active = next.id;
        save();
        chatState(route).notice = "已切换为「" + next.name + "」。";
        render();
      }
    }
  } else if (name === "/checkpoint") {
    openCheckpoints();
  } else if (name === "/reset") {
    const record = contextRecord(route);
    record.contextStart = sessionMessages(route).length;
    record.contextIds = [];
    const state = chatState(route);
    state.retry = null;
    state.failure = "";
    if (!unsentSessions.has(currentSession(route)?.id)) save();
    localNotice(route,"已清空当前会话的上下文，历史记录仍可查看。");
  } else if (name === "/history" || name === "HistoryRead") {
    const history = sessionMessages(route).slice(-8).map((item) =>
      (item.role === "user" ? "你" : item.source) + "：" + (item.text || "图片消息"));
    localNotice(route,"当前会话最近记录\n" + (history.join("\n") || "暂无消息"));
  } else {
    localNotice(route,"当前会话没有这个指令。使用 /help 查看可用指令。");
  }
}


function isRoute(route){
  const [page,id,extra] = route.split("/");
  if (extra !== undefined) return false;
  if (page === "sessions") return Boolean(findPersona(id));
  if (page === "chat") return id === undefined || Boolean(findSession(id));
  return id === undefined && (page === "persona" || page === "config");
}
function fromURL(){
  const candidate = location.hash.slice(1);
  return isRoute(candidate) ? candidate : "persona";
}
function openRoute(next, replace=false) {
  if (!isRoute(next) || current === next) return;
  if (modelProbe.open) modelProbe.close();
  if (sheet.open) sheet.close();
  $("toast").classList.remove("show");
  if (!current.startsWith("chat")) rootScroll.set(current,content.scrollTop);
  const depth = history.state?.depth || 0;
  const returnToChat = next === "config" && current.startsWith("chat");
  history[replace ? "replaceState" : "pushState"]({depth:replace ? depth : depth + 1,returnToChat},"","#" + next);
  current = next;
  render();
}
function back(){
  if (closeChatMenu()) return;
  if (modelProbe.open) { modelProbe.close(); return; }
  if (sheet.open) { sheet.close(); return; }
  if (history.state?.depth > 0) { history.back(); return; }
  const session = currentSession();
  if (session) { openRoute("sessions/" + session.personaId,true); return; }
  openRoute("persona",true);
}
window.addEventListener("popstate", () => {
  if (modelProbe.open) modelProbe.close();
  if (sheet.open) sheet.close();
  $("toast").classList.remove("show");
  if (!current.startsWith("chat")) rootScroll.set(current,content.scrollTop);
  current = fromURL();
  render();
});

function chatHeader(route){
  const persona = sessionPersona(route);
  const session = currentSession(route);
  const avatar = chatAvatar(persona);
  const portrait = session ? `<div class="avatar-display" role="img" aria-label="${html(persona.name)}">${avatar}</div>` :
    `<button type="button" class="avatar-button" data-action="switchPersona" aria-label="切换人格" ${runningChat === route ? "disabled" : ""}>${avatar}</button>`;
  const title = session ? session.title || "新会话" : persona.name;
  return `${iconButton("back","返回","back")}${portrait}
    <div class="chat-heading"><h1 class="sub-title" title="${html(title)}">${html(title)}</h1></div>
    ${chatMenuMarkup(persona,session)}`;

function render(){
  const [page,id] = current.split("/");
  const isChat = page === "chat";
  const isList = page === "sessions";
  const persona = isList ? findPersona(id) : null;
  document.documentElement.dataset.theme = data.theme;
  const header = $("header");
  header.classList.toggle("chat-header",isChat);
  header.innerHTML = isChat ? chatHeader(current) : isList ?
    `${iconButton("back","返回","back")}<div class="chat-heading"><h1 class="sub-title">会话</h1>
      <span class="session-owner">${html(persona.name)}</span></div>
      ${ownedSessions(id).length ? iconButton("plus","新建会话","newSession:" + id,"primary") : ""}` : `
    ${page === "config" && history.state?.returnToChat ? iconButton("back","返回","back") : ""}
    <h1 class="${page === "persona" ? "gallery-title" : ""}">${rootNames[page]}</h1>
    ${page === "persona" ? `<div class="actions">${iconButton("search","搜索","toggleSearch","round")}${iconButton("plus","创建人格","editPersona","primary")}</div>` : ""}`;
  $("navigation").hidden = isChat || isList;
  $("navigation").innerHTML = destinations.map(([key,name,glyph]) => {
    const available = key === "persona" || key === "config";
    return `<button class="nav-item" ${available ? `data-action="route:${key}"` : 'disabled'} ${current === key ? 'aria-current="page"' : ""}>
      <span class="nav-icon">${icon(glyph)}</span><span>${name}</span></button>`;
  }).join("");
  content.className = "content" + (isChat ? " chat" : isList ? " sessions-page" : " root");
  content.innerHTML = isChat ? chatMarkup(current) : isList ? sessionListMarkup(persona) : page === "persona" ? galleryMarkup() : configMarkup();
  if (page === "persona") updateCards();
  content.scrollTop = rootScroll.get(current) || 0;
  if (isChat) $("messages").scrollTop = $("messages").scrollHeight;
  const note = notes[page];
  $("page-note").innerHTML = `<h3>${note[0]}</h3><p>${note[1]}</p>`;
}


function sizeSheet(dialog = sheet){
  const rect = $("app").getBoundingClientRect();
  dialog.style.setProperty("--sheet-left", Math.max(0,rect.left) + "px");
  dialog.style.setProperty("--sheet-bottom", Math.max(0,innerHeight - rect.bottom) + "px");
  dialog.style.setProperty("--sheet-width", rect.width + "px");
  dialog.style.setProperty("--sheet-height", Math.min(rect.height - 50,innerHeight * .88) + "px");
}
function openSheet(title, markup){
  sheet.innerHTML = `<div class="handle" aria-hidden="true"></div><div class="sheet-head">
    <h2 id="sheet-title">${html(title)}</h2>${iconButton("close","关闭","closeSheet")}</div><div class="sheet-body">${markup}</div>`;
  sizeSheet();
  if (!sheet.open) sheet.showModal();
  sheet.querySelector(".sheet-body").scrollTop = 0;
}
window.addEventListener("resize", () => {
  if (sheet.open) sizeSheet();
  if (modelProbe.open) sizeSheet(modelProbe);
});
modelProbe.addEventListener("close",() => {
  if (!modelProbe.open) probeRequest?.abort();
});
sheet.addEventListener("click", (event) => {
  if (event.target !== sheet) return;
  const bounds = sheet.getBoundingClientRect();
  if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) sheet.close();
});

function field(label,name,value="",attrs="",type="text"){
  return `<label class="field">${label}<input name="${name}" type="${type}" value="${html(value)}" ${attrs}></label>`;
}
function textarea(label,name,value="",attrs=""){
  return `<label class="field">${label}<textarea name="${name}" ${attrs}>${html(value)}</textarea></label>`;
}
function select(label,name,items,value){
  return `<label class="field">${label}<select name="${name}" aria-label="${label}">${items.map(([key,display]) =>
    `<option value="${html(key)}" ${key === value ? "selected" : ""}>${html(display)}</option>`).join("")}</select></label>`;

function checkbox(label,name,value){

function form(title,fields,onSubmit,controls="",saveLabel="保存"){
  openSheet(title,`<form class="form"><div class="form-fields">${fields}</div><div class="actions-line">
    <button class="primary" type="submit">${saveLabel}</button>${controls}</div></form>`);
  const node = sheet.querySelector("form");
  const fieldsNode = node.querySelector(".form-fields");
  node.addEventListener("submit", async (event) => {
    event.preventDefault();
    const submit = node.querySelector("[type=submit]");
    submit.disabled = true;
    try {
      await onSubmit(new FormData(node));
      finish("已保存");
    } catch (error) {
      submit.disabled = false;
      let feedback = fieldsNode.querySelector(".form-error");
      if (!feedback) {
        feedback = document.createElement("p");
        feedback.className = "sheet-copy form-error";
        feedback.setAttribute("role","alert");
        fieldsNode.prepend(feedback);
      }
      feedback.textContent = error.message;
      fieldsNode.scrollTop = 0;
    }
  });
}
function refresh(){
  if (!current.startsWith("chat")) rootScroll.set(current,content.scrollTop);
  render();
}
function finish(message){
  save();
  if (sheet.open) sheet.close();
  refresh();
  if (message) notify(message);
}
function readImage(file){
  if (file.size > 1500000) return Promise.reject(new Error("请选择 1.5 MB 以内的图片"));
  if (!["image/png","image/jpeg","image/webp","image/gif"].includes(file.type)) return Promise.reject(new Error("请选择 PNG、JPEG、WebP 或 GIF 图片"));
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.addEventListener("load", () => resolve(reader.result));
    reader.addEventListener("error", () => reject(new Error("读取图片失败")));
    reader.readAsDataURL(file);
  });
}

function normalizedBaseUrl(value){
  let url;
  try { url = new URL(value); }
  catch { throw new Error("请填写有效的 Base URL。"); }
  const loopback = ["localhost","127.0.0.1","[::1]"].includes(url.hostname);
  if (url.protocol !== "https:" && !(url.protocol === "http:" && loopback)) {
    throw new Error("请使用 HTTPS。仅本机地址可使用 HTTP。");
  }
  if (url.username || url.password || url.search || url.hash) {
    throw new Error("Base URL 只填写服务地址和路径。");
  }
  return url.origin + url.pathname.replace(/\/+$/,"").replace(/\/(?:chat\/completions|models)$/,"");
}

function apiStatusMessage(status){
  const messages = {
    401:"API Key 无效或与服务不匹配。",403:"当前 Key 没有访问权限。",
    402:"请检查厂商账户余额或额度。",404:"未找到接口或模型，请检查 Base URL 与模型 ID。",
    429:"请求频率超限或额度不足。"
  };
  return messages[status] || (status >= 500 ? "厂商服务暂不可用，请稍后重试。" : "服务拒绝了请求，请检查配置。");
}
function modelRejectsImages(body){
  const code = body?.error?.code;
  if (["image_input_not_supported","vision_not_supported"].includes(code)) return true;
  const message = typeof body?.error?.message === "string" ? body.error.message : "";
  return /(?:does not|doesn't|cannot) support (?:images\b|image inputs?\b|image content\b|vision\b|multimodal inputs?\b)|(?:image inputs?|vision|multimodal inputs?) (?:is|are) not supported|only supports text(?: input)?|no endpoints found that support image input|不支持(?:图片|图像|视觉|多模态)(?:输入|理解|[。！!，,]|$)/i.test(message);
}
async function requestModelApi(baseUrl,path,key,{payload,signal,visionProbe=false,onDelta} = {}){
  const timeout = AbortSignal.timeout(payload ? 60000 : 15000);
  let response;
  try {
    response = await fetch(baseUrl + path,{
      method:payload ? "POST" : "GET",
      headers:{Authorization:"Bearer " + key,...(payload ? {"Content-Type":"application/json"} : {})},
      body:payload ? JSON.stringify(payload) : undefined,
      signal:signal ? AbortSignal.any([signal,timeout]) : timeout,
      credentials:"omit",redirect:"error",referrerPolicy:"no-referrer",cache:"no-store"
    });
  } catch (error) {
    if (signal?.aborted) throw error;
    if (timeout.aborted) throw new Error("请求超时，请检查网络后重试。");
    throw new Error("浏览器无法连接。请检查地址、网络及服务的跨域（CORS）设置。");
  }
  if (!response.ok) {
    const error = new Error(`HTTP ${response.status} · ${apiStatusMessage(response.status)}`);
    error.httpStatus = response.status;
    if (visionProbe && [400,404,415,422].includes(response.status)) {
      const body = await response.json().catch(() => null);
      error.imageUnsupported = modelRejectsImages(body);
    }
    throw error;
  }
  if (onDelta) {
    try { return await readChatStream(response,onDelta); }
    catch (error) {
      if (signal?.aborted) throw error;
      if (timeout.aborted) throw new Error("回复超时，请重试。");
      throw error;
    }
  }
  try { return await response.json(); }
  catch { throw new Error("服务未返回有效的 OpenAI 兼容 JSON。"); }
}
function serviceInput(values,service){
  const url = normalizedBaseUrl(text(values,"url"));
  const key = text(values,"key") || (service?.url === url ? modelCredentials.get(service.id) : "");
  if (!key) throw new Error("请填写 API Key。");
  return {url,key};
}
function editService(id){
  const existing = data.services.find((item) => item.id === id);
  const service = existing || {id:uid(),provider:"",name:"",url:"",model:"",models:[]};
  const providerOptions = [["","选择厂商"],...Object.entries(modelPresets).map(([key,preset]) => [key,preset.name])];
  let catalog = {url:service.url,models:service.models};
  const savedKey = modelCredentials.get(service.id);
  form(existing ? "编辑模型服务" : "添加模型服务",
    select("厂商","provider",providerOptions,service.provider) +
    field("Base URL","url",service.url,'placeholder="https://api.example.com/v1" required spellcheck="false" autocapitalize="off"',"url") +
    field("API Key","key","",`placeholder="${savedKey ? "已填入 · 留空沿用" : "输入对应厂商的 API Key"}" autocomplete="off" spellcheck="false"`,"password") +
    '<p class="field-help">Key 仅在当前页面有效。</p>' +
    field("默认模型 ID","model",service.model,'placeholder="选择厂商预设或通过探测获取" maxlength="200" spellcheck="false" autocapitalize="off" list="model-suggestions"') +
    '<datalist id="model-suggestions"></datalist>' +
    field("服务名称","name",service.name,'placeholder="选填" maxlength="40"'),
    (values) => {
      const provider = text(values,"provider");
      if (!Object.hasOwn(modelPresets,provider)) throw new Error("请选择厂商或自定义。");
      const {url,key} = serviceInput(values,existing);
      const model = text(values,"model");
      if (!model) throw new Error("请填写模型 ID，或点击「探测列表」后选择。");
      const models = [...new Set([model,...(catalog.url === url ? catalog.models : [])])];
      const changedUrl = existing && existing.url !== url;
      for (const role of ["textModel","visionModel"]) {
        if (data[role]?.serviceId !== service.id) continue;
        if (changedUrl && role === "visionModel") data[role] = null;
        else if (changedUrl || data[role].model === service.model) data[role] = {serviceId:service.id,model};
      }
      Object.assign(service,{provider,name:text(values,"name") || modelPresets[provider].name,url,model,models});
      if (!existing) data.services.push(service);
      modelCredentials.set(service.id,key);
      if (!data.textModel) data.textModel = {serviceId:service.id,model};
    },'<button type="button" class="secondary" id="probe-model-service">探测列表</button>' +
      '<button type="button" class="secondary" id="probe-model-capabilities">能力探测</button>');
  const editor = sheet.querySelector("form");
  function updateSuggestions(){
    editor.querySelector("datalist").innerHTML = catalog.models.map((model) => `<option value="${html(model)}"></option>`).join("");
  }
  updateSuggestions();
  editor.elements.provider.addEventListener("change",() => {
    const preset = modelPresets[editor.elements.provider.value];
    editor.elements.url.value = preset?.url || "";
    editor.elements.model.value = preset?.model || "";
    editor.elements.name.value = "";
    editor.elements.key.value = "";
    editor.elements.key.placeholder = "输入对应厂商的 API Key";
    catalog = {url:"",models:[]};
    updateSuggestions();
  });
  editor.querySelector("#probe-model-capabilities").addEventListener("click",() => {
    openCapabilityProbe(new FormData(editor),existing);
  });
  editor.querySelector("#probe-model-service").addEventListener("click",() => {
    const values = new FormData(editor);
    openModelProbe(values,existing,(result,model) => {
      catalog = result;
      editor.elements.model.value = model;
      updateSuggestions();
    });
  });
}

async function openModelProbe(values,existing,apply){
  probeRequest?.abort();
  let connection;
  try { connection = serviceInput(values,existing); }
  catch (error) {
    showModelProbe(`<p class="probe-state" role="alert">${html(error.message)}</p>`);
    return;
  }
  const {url,key} = connection;
  const controller = new AbortController();
  probeRequest = controller;
  showModelProbe(`<p class="probe-state" role="status">正在读取模型列表…</p><p class="probe-url">${html(url + "/models")}</p>`);
  const started = performance.now();
  try {
    const payload = await requestModelApi(url,"/models",key,{signal:controller.signal});
    if (!Array.isArray(payload?.data)) throw new Error("服务未返回 OpenAI 兼容的模型列表。");
    const models = [...new Set(payload.data.map((item) => item?.id).filter((id) => typeof id === "string" && id.trim() && id.length <= 200))];
    if (controller.signal.aborted || !modelProbe.open) return;
    const elapsed = Math.round(performance.now() - started);
    const currentModel = text(values,"model");
    let selection = models.includes(currentModel) ? currentModel : models.length === 1 ? models[0] : "";
    showModelProbe(`<div role="status"><p class="probe-state probe-success">已读取 ${models.length} 个模型</p>
      <p class="probe-url">GET /models · ${elapsed} ms</p></div>
      ${url === modelPresets.openrouter.url ? '<p class="sheet-copy">这是公开模型列表。API Key 的调用权限以发送消息结果为准。</p>' : ""}
      ${models.length ? `${models.length > 8 ? '<input class="probe-search" type="search" aria-label="搜索模型 ID" placeholder="搜索模型 ID">' : ""}
      <div class="probe-models" aria-label="选择模型"></div>` : '<p class="sheet-copy">服务返回了空列表。可以返回并手动填写模型 ID。</p>'}`,
      models.length ? '<div class="actions-line probe-footer"><button type="button" class="primary" data-apply-model>使用所选模型</button></div>' : "");
    if (!models.length) return;
    const list = modelProbe.querySelector(".probe-models");
    const applyButton = modelProbe.querySelector("[data-apply-model]");
    function renderList(query=""){
      const entries = models.map((model,index) => ({model,index})).filter(({model}) => model.toLowerCase().includes(query.toLowerCase()));
      list.innerHTML = entries.length ? entries.map(({model,index}) =>
        `<button type="button" class="probe-option" data-model-index="${index}" aria-pressed="${model === selection}">${html(model)}</button>`).join("") :
        '<p class="sheet-copy">没有匹配的模型。</p>';
      applyButton.disabled = !selection;
    }
    list.addEventListener("click",(event) => {
      const option = event.target.closest("[data-model-index]");
      if (!option) return;
      selection = models[Number(option.dataset.modelIndex)];
      list.querySelectorAll("[data-model-index]").forEach((node) => node.setAttribute("aria-pressed",node === option));
      applyButton.disabled = false;
    });
    modelProbe.querySelector(".probe-search")?.addEventListener("input",(event) => renderList(event.target.value.trim()));
    applyButton.addEventListener("click",() => {
      apply({url,models},selection);
      modelProbe.close();
    });
    renderList();
  } catch (error) {
    if (!controller.signal.aborted && modelProbe.open) {
      showModelProbe(`<p class="probe-state" role="alert">探测失败</p><p class="sheet-copy">${html(error.message)}</p><p class="probe-url">${html(url + "/models")}</p>`);
    }
  }
}

function visionSample(){
  const colors = [["red","#f22532"],["blue","#1464e8"],["green","#148a32"],["yellow","#ffda00"]];
  for (let index = colors.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [colors[index],colors[other]] = [colors[other],colors[index]];
  }
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 256;
  const context = canvas.getContext("2d");
  context.fillStyle = "#ffffff";
  context.fillRect(0,0,256,256);
  colors.forEach(([,color],index) => {
    context.fillStyle = color;
    context.fillRect(8 + (index % 2) * 124,8 + Math.floor(index / 2) * 124,116,116);
  });
  return {url:canvas.toDataURL("image/png"),answer:colors.map(([name]) => name).join(" ")};
}

async function openCapabilityProbe(values,existing){
  probeRequest?.abort();
  const title = "能力探测";
  const model = text(values,"model");
  let connection;
  try {
    if (!model) throw new Error("请先填写模型 ID，或从模型列表中选择。");
    connection = serviceInput(values,existing);
  } catch (error) {
    showModelProbe(`<p class="probe-state" role="alert">${html(error.message)}</p>`,"",title);
    return;
  }
  const controller = new AbortController();
  probeRequest = controller;
  const active = () => !controller.signal.aborted && modelProbe.open;
  const outcomes = [
    {label:"模型可用性",status:"探测中",detail:"发送一条短文本"},
    {label:"视觉支持",status:"等待探测",detail:"识别一张测试图"}
  ];
  function renderOutcomes(){
    const rows = outcomes.map(({label,status,detail,success}) =>
      `<div class="capability-row"><div class="capability-label"><strong>${label}</strong>
      <span class="badge ${success ? "on" : ""}">${status}</span></div>
      <p class="sheet-copy">${html(detail)}</p></div>`).join("");
    showModelProbe(`<p class="probe-url">${html(model)}</p>
      <div class="capability-results" aria-live="polite">${rows}</div>
      <p class="probe-notice">测试直接请求厂商 API，可能消耗额度。</p>`,"",title);
  }
  async function complete(content,visionProbe=false){
    const started = performance.now();
    const payload = {model,stream:false,messages:[{role:"user",content}]};
    const response = await requestModelApi(connection.url,"/chat/completions",connection.key,
      {payload,signal:controller.signal,visionProbe});
    const output = response?.choices?.[0]?.message?.content;
    return {text:typeof output === "string" ? output.trim() : "",ms:Math.round(performance.now() - started)};
  }

  renderOutcomes();
  try {
    const result = await complete("Reply with OK.");
    Object.assign(outcomes[0],result.text
      ? {status:"可用",detail:`模型已返回文本 · ${result.ms} ms`,success:true}
      : {status:"未能确认",detail:"服务未返回可读的文本回复。"});
  } catch (error) {
    if (!active()) return;
    Object.assign(outcomes[0],{status:"调用失败",detail:error.message});
    if ([401,402,403,404,429].includes(error.httpStatus)) {
      Object.assign(outcomes[1],{status:"未执行",detail:"请处理上方调用错误后重试。"});
      renderOutcomes();
      return;
    }
  }
  if (!active()) return;
  Object.assign(outcomes[1],{status:"探测中",detail:"发送测试图"});
  renderOutcomes();
  try {
    const sample = visionSample();
    const result = await complete([
      {type:"text",text:"Name the four block colors in the image in this order: top left, top right, bottom left, bottom right. Reply only with four English color names, separated by spaces."},
      {type:"image_url",image_url:{url:sample.url}}
    ],true);
    const answer = (result.text.toLowerCase().match(/[a-z]+/g) || []).join(" ");
    Object.assign(outcomes[1],answer === sample.answer
      ? {status:"支持",detail:`正确识别测试图 · ${result.ms} ms`,success:true}
      : {status:"未能确认",detail:"模型没有正确识别测试图。"});
  } catch (error) {
    Object.assign(outcomes[1],error.imageUnsupported
      ? {status:"不支持",detail:"当前服务明确拒绝了该模型的图片输入。"}
      : {status:"未能确认",detail:error.message});
  }
  if (active()) renderOutcomes();
}

function switchPersona(){
  if (chatState("chat").run) return;
  openSheet("切换人格",group("",data.personas.map((persona) =>
    row(persona.name,persona.desc,"person","choosePersona:" + persona.id,persona.id === data.active ? "已激活" : "",true))));
}
function goToPersona(id){
  if (!chatState("chat").run) {
    data.active = id;
    save();
  }
  openRoute("chat");
  if (id !== data.active) notify("主会话正在回复，暂用原人格");
}
async function readChatStream(response,onDelta){
  if (!response.headers.get("content-type")?.toLowerCase().includes("text/event-stream") || !response.body) {
    throw new Error("服务未返回流式响应，请检查模型与接口。");
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let finished = false;
  function handleFrame(frame){
    const data = frame.split(/\r?\n/).filter((line) => line.startsWith("data:"))
      .map((line) => line.slice(5).replace(/^ /,"")).join("\n");
    if (!data) return false;
    if (data.trim() === "[DONE]") return true;
    let event;
    try { event = JSON.parse(data); }
    catch { throw new Error("收到无效的流式响应。"); }
    if (event?.error) throw new Error("服务在生成过程中返回错误。");
    const choice = event?.choices?.[0];
    if (typeof choice?.delta?.content === "string") onDelta(choice.delta.content);
    finished ||= Boolean(choice?.finish_reason);
    return false;
  }
  try {
    while (true) {
      let chunk;
      try { chunk = await reader.read(); }
      catch (error) {
        if (error.name === "AbortError" || error.name === "TimeoutError") throw error;
        throw new Error("回复连接中断，请重试。");
      }
      buffer += decoder.decode(chunk.value,{stream:!chunk.done});
      let separator;
      while ((separator = /\r?\n\r?\n/.exec(buffer))) {
        const frame = buffer.slice(0,separator.index);
        buffer = buffer.slice(separator.index + separator[0].length);
        if (handleFrame(frame)) return;
      }
      if (chunk.done) {
        if (buffer && handleFrame(buffer)) return;
        if (!finished) throw new Error("回复连接提前中断，请重试。");
        return;
      }
    }
  } finally {
    await reader.cancel().catch(() => {});
  }
}
async function demoStream(signal,onDelta,hasImage){
  const chunks = hasImage
    ? ["我收到了图片。","可以从画面内容、构图","或你关心的细节开始。"]
    : ["可以。","先把最重要的一件事写下来，","再给它留出一段完整时间。","剩下的按优先级排开，","我们一项一项看。"];
  for (const chunk of chunks) {
    await new Promise((resolve) => setTimeout(resolve,260));
    signal.throwIfAborted();
    onDelta(chunk);
  }
}
function isChatCommand(value,attachment){
  return !attachment && (value.startsWith("/") || value === "HistoryRead");
}
function send(){
  if (!$("composer")) return;
  const route = current;
  const state = chatState(route);
  const value = state.draft.trim();
  if (state.run || !value && !state.attachment) return;
  if (isChatCommand(value,state.attachment)) {
    state.draft = "";
    $("draft").value = "";
    updateComposer();
    command(route,value);
    return;
  }
  if (runningChat) return;
  return runTurn(route,{pending:{id:uid(),role:"user",text:value,image:state.attachment},persona:{...sessionPersona(route)}});
}
async function runTurn(route,turn){
  if (runningChat) return;
  const state = chatState(route);
  const messages = sessionMessages(route);
  const {pending,persona} = turn;
  const image = pending.image;
  const selection = image && data.visionModel ? data.visionModel : data.textModel;
  const service = data.services.find((item) => item.id === selection?.serviceId);
  const key = service && modelCredentials.get(service.id);
  if (service && !key) {
    notify("请在配置中填写「" + service.name + "」的 API Key");
    return;
  }
  const history = contextMessages(route).filter((item) => item.text && item.remote)
    .slice(-12).map((item) => ({role:item.role,content:item.text}));
  if (!messages.includes(pending)) {
    messages.push(pending);
    commitSession(route,pending);
    state.draft = "";
    state.attachment = "";
  } else if (turn.partial) {
    const partialIndex = messages.indexOf(turn.partial);
    if (partialIndex >= 0) messages.splice(partialIndex,1);
  }
  touchSession(route);
  turn.partial = null;
  state.retry = null;
  state.failure = "";
  state.notice = "";
  const controller = new AbortController();
  const run = {controller,persona,text:""};
  state.run = run;
  runningChat = route;
  pending.status = "等待回复";
  save();
  render();
  $("draft")?.focus({preventScroll:true});
  const onDelta = (delta) => {
    controller.signal.throwIfAborted();
    run.text += delta;
    if (current === route) updateTranscript();
  };
  let status = "";
  try {
    if (service) {
      const userContent = image ? [
        ...(pending.text ? [{type:"text",text:pending.text}] : []),
        {type:"image_url",image_url:{url:image}}
      ] : pending.text;
      const payload = {model:selection.model,stream:true,messages:[
        ...(persona.prompt ? [{role:"system",content:persona.prompt}] : []),
        ...history,{role:"user",content:userContent}
      ]};
      await requestModelApi(service.url,"/chat/completions",key,{payload,signal:controller.signal,onDelta});
    } else {
      await demoStream(controller.signal,onDelta,Boolean(image));
    }
    controller.signal.throwIfAborted();
    if (!run.text.trim()) throw new Error("模型未返回文本。");
    pending.live = true;
    pending.remote = Boolean(service);
  } catch (error) {
    if (controller.signal.aborted) status = "已停止";
    else {
      status = "回复中断";
      state.failure = error.message;
      state.retry = turn;
    }
  } finally {
    pending.status = !run.text ? status : "";
    if (run.text) {
      const reply = {id:uid(),role:"assistant",source:persona.name,text:run.text,status,live:!status,remote:Boolean(service && !status)};
      messages.push(reply);
      turn.partial = reply;
    }
    state.run = null;
    runningChat = null;
    touchSession(route);
    save();
    if (current === route) {
      updateTranscript();
      $("composer-action").innerHTML = composerAction(route);
      const switchButton = $("header").querySelector('[data-action="switchPersona"]');
      if (switchButton) switchButton.disabled = false;
    } else if ($("composer")) {
      $("chat-busy").hidden = true;
      updateComposer();
    } else if (current.startsWith("sessions/") && !sheet.open) {
      refresh();
    }
  }
}

const actions = {
  route: (route) => openRoute(route,Boolean(rootNames[route] && rootNames[current])),
  back, closeSheet:() => sheet.close(),
  toggleSearch:() => { searchOpen = !searchOpen; if (!searchOpen) query = ""; refresh(); $("query")?.focus(); },
  filter:(item) => { filter = item; updateCards(); },
  clearFilter:() => { filter = "全部"; query = ""; if ($("query")) $("query").value = ""; updateCards(); },
  chatPersona:goToPersona, editPersona, switchPersona,
  choosePersona:(id) => { if (!chatState("chat").run && findPersona(id)) { data.active = id; finish(); } },
  otherPersonaSessions, sessionMenu, newSession, renameSession, confirmSessionDelete, deleteSession,
  confirmPersonaDelete, deletePersona, checkpoints:openCheckpoints, saveCheckpoint, restoreCheckpoint,

  service:editService, modelRole:editModelRole,
  stop:() => chatState(current).run?.controller.abort(),
  retry:() => { const state = chatState(current); if (state.retry) runTurn(current,state.retry); },
  attach:() => $("chat-image").click(),
  removeAttachment:() => { chatState(current).attachment = ""; render(); $("draft").focus(); }
};
document.addEventListener("click",(event) => {
  const control = event.target.closest("[data-action]");
  if (!control || control.disabled) return;
  const [name,param] = control.dataset.action.split(":");
  if (control.closest(".chat-overflow")) closeChatMenu();
  actions[name]?.(param);
});
content.addEventListener("focusin",(event) => {
  if (!rootNames[current] || !event.target.matches(":focus-visible")) return;
  const navTop = $("navigation").getBoundingClientRect().top;
  const overflow = event.target.getBoundingClientRect().bottom - navTop + 8;
  if (overflow > 0) content.scrollTop += overflow;
});
document.addEventListener("input",(event) => {
  if (event.target.id === "query") { query = event.target.value; updateCards(); }
  if (event.target.id === "draft") {
    chatState(current).draft = event.target.value;
    updateComposer();
  }
});
document.addEventListener("change",async (event) => {
  if (event.target.name === "cover") {
    const filename = event.target.parentElement.querySelector("[data-filename]");
    filename.textContent = event.target.files[0]?.name || "选择图片";
  }
  if (event.target.id !== "chat-image" || !event.target.files[0]) return;
  const route = current;
  const state = chatState(route);
  try {
    state.attachment = await readImage(event.target.files[0]);
    if (current === route) { render(); $("draft").focus(); }
  } catch (error) { notify(error.message); }
});
document.addEventListener("submit",(event) => {
  if (event.target.id !== "composer") return;
  event.preventDefault();
  send();
});
document.addEventListener("keydown",(event) => {
  if (event.target.id === "draft" && event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    send();
  }
});

current = fromURL();
history.replaceState({depth:history.state?.depth || 0,returnToChat:history.state?.returnToChat || false},"","#" + current);
render();

</script>
